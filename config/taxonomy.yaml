# Taxonomie thématique des publications — répond à la question métier
# « ce post est-il lié à un événement ? à tel ou tel sujet ? », à laquelle
# `type_contenu` (texte / photo / vidéo) ne répond pas : celui-ci décrit le
# FORMAT du média, jamais le SUJET.
#
# Méthode : les thèmes ci-dessous ont d'abord été découverts par clustering
# TF-IDF + KMeans sur les 500 publications (k = 6, 8, 10), puis figés en
# lexique explicite. Le clustering seul donnait un cluster résiduel absorbant
# près de la moitié du corpus, et ses termes discriminants étaient pollués par
# les marqueurs de source (« http bbc », « http cnn ») ; un lexique explicite
# est à la fois plus stable et défendable devant un jury, parce que chaque
# étiquette est justifiable par les mots qui l'ont déclenchée.
#
# TRANSPOSITION À L'INSTITUT SAINT-JEAN : ne remplacer que le bloc `themes`
# par les thèmes scolaires (admission, événement, pédagogie, vie étudiante,
# résultats…). Aucun code n'est à modifier — dw/labeling.py lit ce fichier.

# Nombre minimum de mots-clés à trouver pour qu'un thème soit retenu.
# À 1, un seul mot suffit : volontaire ici, car les publications sont courtes
# (médiane ~110 caractères) et un seuil plus élevé ferait chuter la couverture.
min_occurrences: 1

# Étiquette attribuée quand aucun thème ne se déclenche. Ne jamais la masquer
# dans les analyses : une couverture partielle assumée vaut mieux qu'un
# classement forcé, qui fabriquerait des conclusions sur du bruit.
fallback: non_classe

themes:

  # L'ORDRE COMPTE : en cas d'égalité du nombre de mots-clés trouvés, le thème
  # déclaré le plus haut l'emporte (cf. dw.labeling.classify). Les thèmes
  # spécifiques sont donc placés avant les thèmes génériques — sans quoi
  # « politique » absorberait l'événement « affaire russe », qui en est
  # pourtant le sujet d'étude le plus intéressant.

  affaire_russe:
    description: >
      Affaire des courriels de Donald Trump Jr. — ÉVÉNEMENT ponctuel qui
      éclate pendant la fenêtre observée (9-14 juillet 2017). C'est
      l'équivalent structurel d'un « événement » pour l'Institut : un fait
      daté qui fait basculer le volume et le ton des réactions.
    mots_cles:
      - trump jr
      - russian lawyer
      - veselnitskaya
      - collusion
      - email chain
      - emails
      - hillary clinton
      - russian meddling
      - special counsel
      - kushner
      - meeting

  conflit_international:
    description: "Guerres, terrorisme, diplomatie, droits humains, tensions géopolitiques"
    mots_cles: [mosul, isis, syria, iraq, war, north korea, missile, military, troops,
                refugee, attack, bomb, qatar, sanctions, dissident, human rights,
                weapons, china, chinese, xiaobo, tibet, israel, iran, nato, border]

